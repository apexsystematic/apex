<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Apex Systematic — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .coming-soon-wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px var(--gutter);
    }

    .coming-soon-logo {
      margin-bottom: 64px;
    }

    .coming-soon-logo svg {
      height: 52px;
      width: auto;
    }

    .coming-soon-wrap .section-tag {
      margin-bottom: 1.5rem;
    }

    .coming-soon-wrap h1 {
      font-size: clamp(2.2rem, 4.5vw, 4rem);
      margin-bottom: 1.5rem;
      max-width: 600px;
    }

    .coming-soon-wrap p {
      font-size: 1.05rem;
      max-width: 480px;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .coming-soon-divider {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2.5rem;
      opacity: 0.6;
    }

    .coming-soon-contact {
      margin-top: 48px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .coming-soon-contact a {
      color: var(--gold);
      transition: color var(--ease);
    }

    .coming-soon-contact a:hover {
      color: var(--gold-light);
    }
  </style>
</head>
<body>

  <div class="coming-soon-wrap">

    <div class="coming-soon-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 42 380 70" height="52" role="img">'
        <title>Apex Systematic</title>'
        <line x1="54" y1="48" x2="34" y2="82" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square"/>'
        <line x1="54" y1="48" x2="74" y2="82" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square"/>'
        <line x1="34" y1="82" x2="74" y2="82" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square"/>'
        <circle cx="54" cy="48" r="2.5" fill="#C9A84C"/>'
        <text x="88" y="82" font-family="Georgia, serif" font-size="46" font-weight="400" letter-spacing="10" fill="#FFFFFF">APEX</text>'
        <text x="88" y="104" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="300" letter-spacing="9.5" fill="#C9A84C">SYSTEMATIC</text>'
      </svg>
    </div>

    <span class="section-tag">Under construction</span>
    <h1>Something better<br>is on its way.</h1>

    <div class="coming-soon-divider"></div>

    <p>We're putting the finishing touches on the new Apex Systematic website. We help professional services firms reclaim hours every week through custom AI automation — fixed price, no retainer, you own everything.</p>

    <p class="coming-soon-contact">
      Questions? <a href="mailto:hello@apexsystematic.com">hello@apexsystematic.com</a>
    </p>

  </div>

</body>
</html>
